    hdmi: '<rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 11h2M6 13h2"/>',
    tv: '<rect x="3" y="7" width="18" height="12" rx="2"/><path d="M8 3l4 4 4-4"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'
  };
  var controls = { items: [], index: 0 };

  // The TV's inputs as { connected: [...], disconnected: [...] } of { type, number }, or null
  function videoSources(done) {
    if (!isTizen) { // browser preview: a TV with one device plugged in
      done({
        connected: [{ type: "TV", number: 1 }, { type: "HDMI", number: 1 }],
        disconnected: [{ type: "HDMI", number: 2 }, { type: "HDMI", number: 3 }, { type: "HDMI", number: 4 }]
      });
      return;
    }
    try {
      tizen.systeminfo.getPropertyValue("VIDEOSOURCE", done, function () { done(null); });
    } catch (e) { done(null); }
  }

  function controlItems(sources) {
    var items = [{ run: "home", icon: "home", label: APP_NAME, end: "✓", choice: true }];
    if (sources) {
      // The tuner first, then the ports in order
      var list = (sources.connected || []).slice().sort(function (a, b) {
        return (a.type === "TV" ? 0 : 1) - (b.type === "TV" ? 0 : 1) || a.number - b.number;
      });
      list.forEach(function (src) {
        var tv = src.type === "TV";
        items.push({
          run: "source", src: src, icon: tv ? "tv" : "hdmi", choice: true,
          label: tv ? "TV" : src.type + " " + src.number,
          sub: tv ? "Antenna and cable channels" : "Connected"
        });
      });
    }
    items.push({ run: "settings", icon: "settings", label: "TV settings", end: "›", rule: true });
    return items;
  }

  function escHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function renderControls() {
    var html = '<div class="controls-head">Input</div>';
    controls.items.forEach(function (it, i) {
      if (it.rule) html += '<div class="controls-rule"></div>';
      html += '<div class="controls-item' + (it.choice ? " choice" : "") + (i === controls.index ? " focused" : "") + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        CONTROL_ICONS[it.icon] + '</svg><div class="text"><div>' + escHtml(it.label) + '</div>' +
        (it.sub ? '<div class="sub">' + escHtml(it.sub) + '</div>' : '') + '</div>' +
        (it.end ? '<div class="end">' + escHtml(it.end) + '</div>' : '') + '</div>';
    });
    $("controls-menu").innerHTML = html;
  }

  function openControls() {
    videoSources(function (sources) {
      if (zone !== "top") return; // moved on while the TV answered
      controls.items = controlItems(sources);
      controls.index = Math.min(1, controls.items.length - 1); // the first input, just below Zen TV
      renderControls();
      setZone("controls");
    });
  }

  function switchInput(it) {
    if (!isTizen) { toast("Switches to " + it.label + " on the TV"); return; }
    cancelled = null;
    var fallback = function () { toast("Couldn't switch to " + it.label); };
    try {
      tizen.tvwindow.setSource(it.src, function () {
        stopWatching();
        try { tizen.application.getCurrentApplication().hide(); } catch (e) { fallback(); }
      }, fallback, "MAIN");
    } catch (e) { fallback(); }
  }

  function runControl() {
    var it = controls.items[controls.index];
    setZone("top");
    if (it.run === "source") switchInput(it);
    else if (it.run === "settings") openSettings();
  }

  // Samsung's Settings opens as an overlay on top of Zen TV, and Back only hides it: it stays
  // running and keeps the remote. The one sign it's gone is our window getting focus back (after
  // losing it to Settings); Zen TV then relaunches itself, which returns the remote to it.
  var settingsDone = null; // stops watching for the current Settings visit
  function openSettings() {
    if (!isTizen) { toast("Opens Settings on the TV"); return; }
    if (settingsDone) settingsDone();
    stopWatching(); // not an app to bring Zen TV back from
    cancelled = null;
    var blurred = false;
    // Settings takes focus within about a second; if it hasn't in 5s it didn't open
    var openTimer = setTimeout(function () { if (!blurred) done(); }, 5000);
    var onBlur = function () { blurred = true; };
    var onFocus = function () {
      if (!blurred) return;
      done();
      try { tizen.application.launch(tizen.application.getCurrentApplication().appInfo.id); } catch (e) {}
    };
    var onVisibility = function () { if (document.hidden) done(); }; // something else took the screen
    var done = function () {
      clearTimeout(openTimer);
      window.removeEventListener("blur", onBlur);
      window.removeEventListener("focus", onFocus);
      document.removeEventListener("visibilitychange", onVisibility);
      settingsDone = null;
    };
    settingsDone = done;
    window.addEventListener("blur", onBlur);
    window.addEventListener("focus", onFocus);
    document.addEventListener("visibilitychange", onVisibility);
    var failed = function () { done(); toast("Couldn't open Settings"); };
    try { tizen.application.launch(SETTINGS_APP, null, failed); } catch (e) { failed(); }
  }

  /* ---------- Focus zones: top line, hero button, app row, Trending, Classics, Watch Later ---------- */
  // Zones: "top" (profile pill / controls / search), "profiles" and "controls" (their menus open),
  // "hero", "apps", the title rows,
  // "search", "browse" (a row's "View more" grid), and "detail" (a title's buttons, over the row,
  // search or grid it came from)
  var ROW_ZONES = ["trend", "classic", "later"]; // top to bottom, below the app row
  var titleRows = { trend: trendRow, classic: classicRow, later: laterRow };
  var zone = "apps";
  var stage = $("stage");
  function setZone(z) {
    // Entering a title row: drop any rotation image still loading, the row previews its own
    if (titleRows[z]) cancelPreview();
    zone = z;
    // The detail view keeps its row's position (the rows just fade out)
    var from = z === "detail" ? detail.from : z;
    stage.className = (from === "search" ? "search-open" : from === "browse" ? "browse-open zone-" + browse.from :
      titleRows[from] ? "zone-" + from : "") +
      (z === "detail" ? " detail" : "") + (z === "profiles" ? " profiles-open" : "") +
      (z === "controls" ? " controls-open" : "");
    // Browsing anything but the app row pauses the rotation; title rows show the focused title
    holdBackground = z !== "apps";
    $("hero-btn").className = "hero-btn glass" + (z === "hero" ? " focused" : "");
    $("profile").className = "profile glass" + ((z === "top" && topFocus === "profile") || z === "profiles" ? " focused" : "");
    $("search-btn").className = "search-btn glass" + (z === "top" && topFocus === "search" ? " focused" : "");
    var onControls = (z === "top" && topFocus === "controls") || z === "controls";
    $("controls-btn").className = "controls-btn glass" + (onControls ? " focused" : "");
    $("controls-label").className = "controls-label" + (z === "top" && topFocus === "controls" ? " show" : "");
    if (cells[current]) cells[current].className = "cell" + (z === "apps" ? " focused" : "");
    // the row in use (a detail view or the grid count as their row), for image loading
    var at = ROW_ZONES.indexOf(z === "detail" ? detail.from : z === "browse" ? browse.from : z);
    ROW_ZONES.forEach(function (rz, i) {
      var r = titleRows[rz];
      r.active = rz === z;
      if (r.active) r.focus(r.current, true); else r.blur();
      if (!r.near && i <= at + 1) r.setNear(true); // once loaded, a row keeps its images
    });
    if (z === "apps") { showHeldRows(); rerankAppRows(); } // updates held back while you browsed
  }

  // The hero button only shows for movie/TV backgrounds, and says whether it's already saved
  function updateHeroButton() {
    var savable = !!(currentBg && currentBg.tmdbId);
    $("hero").className = "hero" + (savable ? " can-save" : "");
    $("hero-btn").textContent = savable && isSaved(currentBg.id) ? "✓ In Watch Later" : "+ Watch Later";
    if (!savable && zone === "hero") setZone("apps");
  }

  rememberSaved(readLater());
  laterRow.setItems(readLater());

  /* ---------- Remote control ---------- */
  // In a browser (testing on the TV's web browser), go full screen on the first key press.
  // Browsers only allow this from a user gesture; the installed TV app is always full screen.
  function goFullscreen() {
    if (isTizen || document.fullscreenElement || document.webkitFullscreenElement) return;
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      try { var p = req.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
  }
  document.addEventListener("click", goFullscreen);

  // OK is handled once per physical press: the remote repeats keydown (every ~0.1s) while a key is
  // held, so repeats are ignored (otherwise holding OK would relaunch an app or flip Watch Later on
  // and off). A repeat is an OK that comes soon after the previous one with no keyup in between.
  // The keyup alone isn't enough: when OK opens an app, the keyup goes to that app, not to us.
  var OK_REPEAT_MS = 500;
  var okDown = false, lastOkAt = 0;
  document.addEventListener("visibilitychange", function () { okDown = false; });

  document.addEventListener("keydown", function (e) {
    goFullscreen();
    var k = e.keyCode;
    if (!isTizen && (k === 27 || k === 8)) k = 10009; // browser preview: Escape / Backspace act as Back
    if (k === 37 || k === 38 || k === 39 || k === 40 || k === 13 || k === 10009) e.preventDefault();
    if (k === 10009 && opening) { cancelLaunch(); return; }
    if (k === 13) {
      var now = Date.now(), repeat = okDown && now - lastOkAt < OK_REPEAT_MS;
      lastOkAt = now;
      if (repeat) return;
      okDown = true;
    }

    if (zone === "detail") {
      // Left/Right move to the next usable button, stopping at the ends (no wrap-around)
      var step = function (d) {
        for (var f = detail.focus + d; f >= 0 && f < detail.actions.length; f += d) {
          if (!detail.actions[f].disabled) { detail.focus = f; detail.moved = true; break; }
        }
        renderDetail();
      };
      if (k === 37) step(-1);
      else if (k === 39) step(1);
      else if (k === 38 || k === 10009) closeDetail();
      else if (k === 13 && detail.actions[detail.focus].run) detail.actions[detail.focus].run();
    } else if (zone === "apps") {
      if (k === 37) focus(current - 1);
      else if (k === 39) focus(current + 1);
      else if (k === 38) setZone(currentBg && currentBg.tmdbId ? "hero" : "top");
      else if (k === 40 && RECOMMENDATIONS) setZone("trend");
      else if (k === 13) launch();
    } else if (zone === "hero") {
      if (k === 40 || k === 10009) setZone("apps");
      else if (k === 38) setZone("top");
      else if (k === 13) toggleSaved(currentBg);
    } else if (zone === "top") {
      if (k === 37 || k === 39) {
        var t = TOP_ORDER.indexOf(topFocus) + (k === 39 ? 1 : -1);
        topFocus = TOP_ORDER[Math.max(0, Math.min(TOP_ORDER.length - 1, t))];
        setZone("top");
      }
      else if (k === 40 || k === 10009) setZone("apps");
      else if (k === 13 && topFocus === "search") openSearch();
      else if (k === 13 && topFocus === "controls") openControls();
      else if (k === 13) { menuIndex = profileIds.indexOf(profile.id); renderProfileMenu(); setZone("profiles"); }
    } else if (zone === "profiles") {
      if (k === 38 || k === 40) {
        menuIndex = Math.max(0, Math.min(profileIds.length - 1, menuIndex + (k === 40 ? 1 : -1)));
        renderProfileMenu();
      } else if (k === 10009 || k === 37) setZone("top");
      else if (k === 13) {
        if (profileIds[menuIndex] === profile.id) setZone("top");
        else switchProfile(profileIds[menuIndex]);
      }
    } else if (zone === "controls") {
      if (k === 38 || k === 40) {
        controls.index = Math.max(0, Math.min(controls.items.length - 1, controls.index + (k === 40 ? 1 : -1)));
        renderControls();
      } else if (k === 10009) setZone("top");
      else if (k === 13) runControl();
    } else if (zone === "browse") {
      if (k === 37) focusBrowse(browse.index - 1);
      else if (k === 39) focusBrowse(browse.index + 1);
      else if (k === 38) { if (browse.index >= BROWSE_COLS) focusBrowse(browse.index - BROWSE_COLS); }
      else if (k === 40) { if (browse.index + BROWSE_COLS < browse.cells.length || Math.floor(browse.index / BROWSE_COLS) < Math.floor((browse.cells.length - 1) / BROWSE_COLS)) focusBrowse(browse.index + BROWSE_COLS); }
      else if (k === 13) openDetail({ item: function () { return browse.items[browse.index]; } }, "browse");
      else if (k === 10009) closeBrowse();
    } else if (zone === "search") {
      if (searchFocus === "results") {
        if (k === 37) searchRow.focus(searchRow.current - 1);
        else if (k === 39) searchRow.focus(searchRow.current + 1);
        else if (k === 38 || k === 10009) setSearchFocus(inputFocus());
        else if (k === 13) { stopListening(); openDetail(searchRow, "search"); }
      } else if (searchFocus === "keys") {
        if (k === 37) keyCol = Math.max(0, keyCol - 1);
        else if (k === 39) keyCol = Math.min(KEYS[keyRow].length - 1, keyCol + 1);
        else if (k === 38) moveKeyRow(-1);
        else if (k === 40 && !moveKeyRow(1) && searchRow.items.length) { setSearchFocus("results"); return; }
        else if (k === 13) { pressKey(); return; }
        else if (k === 10009) { closeSearch(); return; }
        renderKeyboard();
      } else { // voice: the mic, then "Type instead" below it
        if (k === 38 && searchFocus === "type") setSearchFocus("mic");
        else if (k === 40 && searchFocus === "mic") setSearchFocus("type");
        else if (k === 40 && searchRow.items.length) setSearchFocus("results");
        else if (k === 13 && searchFocus === "mic") listen();
        else if (k === 13) useKeyboard();
        else if (k === 10009) {
          // Back stops listening first, then leaves search
          if (voice) { stopListening(); renderVoice("idle", query); } else closeSearch();
        }
      }
    } else {
      var row = titleRows[zone];
      var at = ROW_ZONES.indexOf(zone);
      if (k === 37) row.focus(row.current - 1);
      else if (k === 39) row.focus(row.current + 1);
      else if (k === 10009) setZone("apps");
      else if (k === 38) setZone(at > 0 ? ROW_ZONES[at - 1] : "apps");
      else if (k === 40 && at < ROW_ZONES.length - 1) setZone(ROW_ZONES[at + 1]);
      else if (k === 13) openDetail(row, zone);
    }
    if (k === 78 && !isTizen) showNext(); // N: next background (browser preview only)
  });

  document.addEventListener("keyup", function (e) {
    if (e.keyCode === 13) okDown = false;
  });
})();
</script>
</body>
</html>
