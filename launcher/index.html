<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Zen TV</title>
<style>
  /* Inter (OFL), bundled so the first frame never waits on the network at power-on */
  @font-face { font-family: "Inter"; font-weight: 300; font-display: swap; src: url(fonts/inter-300.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url(fonts/inter-400.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 500; font-display: swap; src: url(fonts/inter-500.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url(fonts/inter-600.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; font-display: swap; src: url(fonts/inter-700.woff2) format("woff2"); }

  /* Written for the 2018 Tizen engine (Chromium 56): flexbox only, no grid,
     no flex gap, no backdrop-filter, no optional chaining. */
  :root {
    --fg: #fff;
    --fg-dim: rgba(255, 255, 255, 0.72);
    --fg-faint: rgba(255, 255, 255, 0.5);
    --tile-w: 336px;
    --tile-h: 189px;
    --tile-gap: 40px;
    --tile-r: 20px;
    --edge: 96px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: var(--fg);
    font-family: "Inter", "SamsungOne", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 1920x1080 stage, scaled to fit when previewed in a smaller window */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    margin: -540px 0 0 -960px;
    overflow: hidden; background: #05070c;
    transform-origin: 50% 50%;
  }

  /* Background */
  #bg-fallback {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    background:
      radial-gradient(ellipse at 30% 20%, #1d3b5c 0%, transparent 60%),
      radial-gradient(ellipse at 80% 90%, #3a1d4a 0%, transparent 55%),
      #05070c;
  }
  .photo {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 2.4s ease;
    will-change: transform, opacity; /* own GPU layer, so the slow zoom never repaints */
    /* No CSS filter here: saturate()/contrast() on this full-screen animated layer made the 2018
       TV render no images at all */
  }
  .photo.visible { opacity: 1; }
  .photo.fast { transition-duration: 0.6s; } /* focus previews while browsing a title row */
  /* Slow Ken Burns drift; runs a little longer than each photo is shown. Zoom stays at or under
     6% so 1920px images are barely upscaled and stay crisp; drift stays inside the zoom margin. */
  .photo.kb0 { -webkit-animation: kb0 70s linear forwards; animation: kb0 70s linear forwards; }
  .photo.kb1 { -webkit-animation: kb1 70s linear forwards; animation: kb1 70s linear forwards; }
  .photo.kb2 { -webkit-animation: kb2 70s linear forwards; animation: kb2 70s linear forwards; }
  .photo.kb3 { -webkit-animation: kb3 70s linear forwards; animation: kb3 70s linear forwards; }
  @keyframes kb0 { from { transform: scale(1.01) translate(0, 0); }         to { transform: scale(1.06) translate(-1.5%, -1%); } }
  @keyframes kb1 { from { transform: scale(1.06) translate(1.5%, 1%); }     to { transform: scale(1.01) translate(0, 0); } }
  @keyframes kb2 { from { transform: scale(1.03) translate(-1%, 0); }       to { transform: scale(1.06) translate(1.5%, -1%); } }
  @keyframes kb3 { from { transform: scale(1.06) translate(0, -1.5%); }     to { transform: scale(1.02) translate(-0.5%, 0.5%); } }
  /* Shading is kept to three partial layers (top, bottom, left); the photo itself is undimmed, like
     tvOS. Fewer full-screen layers means less blending work per frame on the TV. */
  .scrim-top, .scrim-bottom { z-index: 3; }
  .statusbar, .profile, .hero, .toast { z-index: 4; }
  /* Like Apple's, shading only sits right behind text and tiles, so most of the image keeps its color */
  .scrim-top {
    position: absolute; top: 0; left: 0; right: 0; height: 180px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.22), rgba(0,0,0,0));
  }
  .scrim-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 440px;
    background: linear-gradient(to top, rgba(0,0,0,0.5), rgba(0,0,0,0.12) 50%, rgba(0,0,0,0));
  }

  /* Status bar: a tvOS-style glass tab bar, centred at the top. The "selected" white
     segment holds the time; date and weather sit in the plain segments. */
  .statusbar {
    position: absolute; top: 54px; left: 50%;
    -webkit-transform: translateX(-50%); transform: translateX(-50%);
    display: flex; align-items: center;
    padding: 6px; border-radius: 999px; white-space: nowrap;
  }
  .seg {
    padding: 12px 30px; border-radius: 999px;
    font-size: 26px; font-weight: 500; line-height: 1.15; color: var(--fg);
    text-shadow: 0 1px 6px rgba(0,0,0,0.25);
  }
  .seg-on { /* a quiet tint: the solid fill is kept for focus alone */
    color: var(--fg); background: rgba(255,255,255,0.2); font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: 0.01em;
  }
  .seg-wx { display: none; align-items: center; }
  .seg-wx.ready { display: flex; }
  .seg-wx svg { width: 34px; height: 34px; margin-right: 10px; }
  .seg-wx .hilo { margin-left: 14px; font-size: 21px; font-weight: 400; color: var(--fg-faint); }

  /* Profile pill, top left: like the profile switcher in tvOS Control Center. Same height and
     top as the status bar (6 + 54 + 6 = 66px) so the two line up. */
  .profile {
    position: absolute; top: 54px; left: var(--edge);
    display: flex; align-items: center;
    padding: 6px 28px 6px 6px; border-radius: 999px;
  }
  .avatar {
    width: 54px; height: 54px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, #8e8cf6 0%, #5e5ce6 45%, #bf5af2 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 2px 8px rgba(0,0,0,0.25);
    font-size: 26px; font-weight: 600; color: #fff;
  }
  .profile-name {
    margin-left: 14px;
    font-size: 26px; font-weight: 500;
    text-shadow: 0 1px 6px rgba(0,0,0,0.25);
  }
  /* App tiles: the icon (shaped to the tile by scripts/zentv.py icons) over the app's name */
  .tile.app-tile { background-color: #1c1e26; background-size: cover; display: flex; align-items: center; justify-content: center; }
  .app-label { font-size: 30px; font-weight: 600; color: var(--fg); visibility: hidden; }
  /* Up from the apps reaches the top line: profile pill (left) and search (right) */
  .profile, .search-btn, .controls-btn { transition: transform 0.2s cubic-bezier(0.34, 1.45, 0.64, 1), background-color 0.15s ease, color 0.15s ease; }
  .profile.focused, .search-btn.focused, .controls-btn.focused { background: #fff; color: #111; transform: scale(1.06); }
  .profile.focused .profile-name { text-shadow: none; }

  /* Profile menu: drops from the pill */
  .profile-menu {
    position: absolute; top: 138px; left: var(--edge); z-index: 6; min-width: 300px;
    padding: 10px; border-radius: 28px; display: none;
  }
  .profiles-open .profile-menu { display: block; }
  .profile-item {
    display: flex; align-items: center; padding: 8px 24px 8px 8px; border-radius: 999px;
    font-size: 26px; font-weight: 500;
  }
  .profile-item .avatar { width: 48px; height: 48px; font-size: 22px; margin-right: 16px; }
  .profile-item.focused { background: #fff; color: #111; }
  .profile-item .check { margin-left: auto; padding-left: 24px; }

  /* Search: top right, same height as the pill */
  .search-btn {
    position: absolute; top: 54px; right: var(--edge); z-index: 4;
    width: 66px; height: 66px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .search-btn svg { width: 30px; height: 30px; }
  .search-btn path, .search-btn circle { stroke: currentColor; }

  /* Controls: left of Search. One button for the TV's inputs and Samsung's Settings; its name shows
     below it while focused */
  .controls-btn {
    position: absolute; top: 54px; right: calc(var(--edge) + 84px); z-index: 4;
    width: 66px; height: 66px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .controls-btn svg { width: 30px; height: 30px; }
  .controls-btn path, .controls-btn circle { stroke: currentColor; }
  .controls-label {
    position: absolute; top: 132px; right: calc(var(--edge) + 64px); z-index: 4; width: 106px;
    text-align: center; font-size: 20px; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    opacity: 0; transition: opacity 0.15s ease;
  }
  .controls-label.show { opacity: 1; }

  /* Controls menu: drops from the button, the same glass as the profile menu */
  .controls-menu {
    position: absolute; top: 138px; right: var(--edge); z-index: 6; width: 540px;
    box-sizing: border-box; padding: 12px; border-radius: 32px; display: none;
  }
  .controls-open .controls-menu { display: block; }
  .controls-head {
    padding: 10px 22px 6px; font-size: 19px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.75); text-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }
  .controls-item {
    display: flex; align-items: center; padding: 10px 22px; border-radius: 22px;
    font-size: 27px; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }
  .controls-item svg { width: 34px; height: 34px; flex: none; margin-right: 22px; }
  .controls-item path, .controls-item rect, .controls-item circle { stroke: currentColor; }
  .controls-item .text { flex: 1; display: flex; flex-direction: column; }
  .controls-item .sub { margin-top: 2px; font-size: 21px; font-weight: 400; color: rgba(255,255,255,0.75); }
  .controls-item.choice { margin-left: 28px; } /* the inputs sit under their heading */
  .controls-item .end { margin-left: 18px; }
  .controls-item.focused { background: #fff; color: #111; text-shadow: none; }
  .controls-item.focused .sub { color: #4a4d55; }
  .controls-rule { height: 1px; margin: 6px 22px; background: rgba(255,255,255,0.2); }

  /* Search screen: a dimmed page over the background. Voice first (a mic that listens, what it heard,
     "Type instead"); the keyboard mode has a field and an on-screen keyboard (the remote has no
     letters). Results sit below either. */
  .search-ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; display: none;
    background: rgba(0, 0, 0, 0.62);
  }
  .search-open .search-ui { display: block; }
  .search-open .rows, .search-open .hero, .search-open .scrim-left { opacity: 0; }
  .detail.search-open .search-ui { display: none; }
  .detail.search-open .hero, .detail.search-open .scrim-left { opacity: 1; }
  .search-field {
    position: absolute; top: 150px; left: var(--edge); width: 1264px;
    padding: 18px 30px; border-radius: 999px;
    font-size: 34px; font-weight: 400; min-height: 80px;
  }
  .search-field .placeholder { color: var(--fg-dim); }
  .search-field .caret { display: inline-block; width: 3px; height: 38px; margin-left: 2px; vertical-align: -6px; background: var(--fg); }
  .keyboard { position: absolute; top: 262px; left: var(--edge); }
  .key-row { display: flex; margin-bottom: 10px; }
  .key {
    width: 88px; height: 64px; margin-right: 10px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 500; background: rgba(255,255,255,0.10);
    transition: transform 0.12s ease, background-color 0.12s ease;
  }
  .key.wide { width: 286px; font-size: 24px; }
  .key .mic { width: 26px; height: 26px; margin-right: 10px; }
  .key .mic rect, .key .mic path { stroke: currentColor; }
  .key.focused { background: #fff; color: #111; transform: scale(1.1); }
  #search-shelf { top: 600px; }

  /* "View more": the end of Trending and Classics (a glass circle with an arrow, and its label; no
     card behind it), and the full-screen grid it opens */
  .more-card .lift, .more-card .lift::before { box-shadow: none; }
  .title-row .more-card .tile { /* beats the cards' dark loading base */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: none;
  }
  .more-card .tile::before, .more-card .tile::after { display: none; }
  .more-circle {
    width: 110px; height: 110px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .more-circle svg { width: 44px; height: 44px; }
  .more-circle path { stroke: currentColor; }
  .more-label { margin-top: 18px; font-size: 26px; font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,0.5); }
  .more-card.focused .more-circle { background: #fff; color: #111; }
  .browse-ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; display: none;
    background: rgba(0, 0, 0, 0.72);
  }
  .browse-open .browse-ui { display: block; }
  .browse-open .rows, .browse-open .hero, .browse-open .scrim-left { opacity: 0; }
  .detail.browse-open .browse-ui { display: none; }
  .detail.browse-open .hero, .detail.browse-open .scrim-left { opacity: 1; }
  .browse-title {
    position: absolute; top: 140px; left: var(--edge);
    font-size: 56px; font-weight: 300; letter-spacing: -0.01em;
  }
  /* 4 cards per line (416 + 40 gap); the grid slides up so the focused line stays in view */
  .browse-window { position: absolute; top: 224px; left: var(--edge); right: 0; bottom: 0; overflow: hidden; }
  .browse-grid {
    display: flex; flex-wrap: wrap; width: 1824px; padding-top: 40px; /* room for the focused card to rise */
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform;
  }
  .browse-grid .cell { width: 416px; margin: 0 40px 70px 0; }
  .browse-grid .tile { width: 416px; height: 234px; background-size: cover; background-color: #15171d; }
  .browse-grid .tile::before, .browse-grid .tile::after { display: none; }
  .mode-voice .search-field, .mode-voice .keyboard, .mode-keys .voice-panel { display: none; }

  /* Voice: a centred mic that glows and pulses (transform/opacity only) while it listens */
  .voice-panel { position: absolute; top: 150px; left: 0; right: 0; text-align: center; }
  .voice-mic {
    position: relative; margin: 0 auto; width: 150px; height: 150px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.14); color: #fff;
    transition: transform 0.2s cubic-bezier(0.34, 1.45, 0.64, 1);
  }
  .voice-mic svg { position: relative; width: 64px; height: 64px; }
  .voice-mic rect, .voice-mic path { stroke: currentColor; }
  .listening .voice-mic { background: linear-gradient(145deg, #8e8cf6 0%, #5e5ce6 45%, #bf5af2 100%); }
  .voice-mic.focused { transform: scale(1.08); }
  .idle .voice-mic.focused, .error .voice-mic.focused { background: #fff; color: #111; }
  .voice-mic .ring {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
    border: 3px solid rgba(191, 90, 242, 0.7); opacity: 0;
  }
  .listening .ring { -webkit-animation: listen-pulse 1.8s ease-out infinite; animation: listen-pulse 1.8s ease-out infinite; }
  .listening .ring.r2 { -webkit-animation-delay: 0.9s; animation-delay: 0.9s; }
  @-webkit-keyframes listen-pulse { from { -webkit-transform: scale(1); opacity: 0.8; } to { -webkit-transform: scale(1.9); opacity: 0; } }
  @keyframes listen-pulse { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.9); opacity: 0; } }
  .voice-headline { margin-top: 44px; font-size: 64px; font-weight: 300; letter-spacing: -0.01em; line-height: 1.1; }
  .voice-hint { margin-top: 12px; min-height: 34px; font-size: 28px; color: var(--fg-dim); }
  .voice-type {
    display: inline-block; margin-top: 24px; padding: 14px 30px; border-radius: 999px;
    font-size: 24px; font-weight: 600;
    transition: transform 0.2s cubic-bezier(0.34, 1.45, 0.64, 1), background-color 0.15s ease, color 0.15s ease;
  }
  .voice-type.focused { background: #fff; color: #111; transform: scale(1.06); }

  /* Liquid Glass pill, faked for an engine without backdrop-filter: a light-to-clear
     gradient body, bright top rim, faint border, and a soft drop shadow */
  .glass {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.07) 55%, rgba(255,255,255,0.10) 100%),
      rgba(28, 30, 38, 0.38);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.45),
      inset 0 -10px 22px -14px rgba(0,0,0,0.35),
      0 12px 30px rgba(0,0,0,0.30);
  }
  /* App row: one row that runs off the right edge and scrolls with focus, like tvOS shelves */
  .shelf {
    position: absolute; left: var(--edge); right: 0; top: 750px;
  }
  .row {
    display: flex;
    transition: transform 0.24s cubic-bezier(0.25, 1, 0.5, 1);
    will-change: transform;
  }
  .cell {
    position: relative; flex: none;
    width: var(--tile-w);
    margin-right: var(--tile-gap);
  }
  /* Liquid Glass tiles, faked without backdrop-filter:
     .lift  scales/lifts on focus with a small spring
     .tile  the app art
     ::before  glass rim: bright top edge, thin light border, inner depth shading
     ::after   specular glint that drifts slowly across the focused tile */
  /* Performance on the 2018 TV: only transform and opacity ever animate (GPU-composited).
     Shadows are pre-rendered and faded in, never animated themselves. */
  /* Depth comes from light, as on tvOS: at rest a tight contact shadow seats the tile and a soft
     ambient shadow gives it weight; a hairline keeps white tiles crisp on bright skies. */
  .lift {
    position: relative;
    border-radius: var(--tile-r);
    box-shadow:
      0 2px 3px rgba(0,0,0,0.28),
      0 8px 20px -4px rgba(0,0,0,0.32);
    /* no translateZ(0): a permanent GPU layer per card (~170 with the grid) is too much for this TV;
       the browser promotes a card only while its transform animates */
    transform: scale(1);
    /* leaving focus: quick ease-out */
    transition: transform 0.16s cubic-bezier(0.25, 1, 0.5, 1);
    cursor: pointer;
  }
  .lift::before {
    /* Focused, the tile rises toward you, so its shadow falls lower, spreads and softens.
       Pre-rendered and faded in rather than animated, to stay cheap on the TV. */
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    border-radius: var(--tile-r);
    box-shadow:
      0 14px 22px -8px rgba(0,0,0,0.45),
      0 36px 64px -12px rgba(0,0,0,0.55);
    opacity: 0; transition: opacity 0.18s ease;
  }
  .cell.focused .lift::before { opacity: 1; }
  .tile {
    position: relative;
    width: var(--tile-w); height: var(--tile-h);
    border-radius: var(--tile-r); overflow: hidden;
    background-repeat: no-repeat; background-position: center;
    background-size: 280px 280px; /* ~1.1x the TV's 250px art: logo fills the tile, still crisp */
  }
  /* Inner depth only: a soft shade along the bottom. No light rim or hairline at the edge: up close
     on the TV those read as a see-through border around the icon. */
  .tile::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2;
    border-radius: var(--tile-r); pointer-events: none;
    box-shadow: inset 0 -18px 30px -18px rgba(0,0,0,0.35);
  }
  .tile::after {
    content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; z-index: 3;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.12) 18%, rgba(255,255,255,0) 38%);
    transform: translate(-22%, -26%);
    opacity: 0.18; transition: opacity 0.18s ease;
  }
  .cell.focused { z-index: 2; }
  .cell.focused .lift {
    transform: scale(1.1) translateY(-8px);
    /* gaining focus: a small spring overshoot, like tvOS */
    transition: transform 0.24s cubic-bezier(0.34, 1.45, 0.64, 1);
  }
  /* Glint drifts slowly on the focused tile (a cheap composited transform; the 3D idle sway was
     dropped because it kept the GPU busy and made scrolling lag on the TV) */
  .cell.focused .tile::after { opacity: 1; -webkit-animation: glint 6s ease-in-out 0.4s infinite; animation: glint 6s ease-in-out 0.4s infinite; }
  @keyframes glint {
    0%, 100% { transform: translate(-30%, -30%); }
    50%      { transform: translate(-8%, -22%); }
  }
  .cell.launching .lift { transform: scale(1.04); transition-duration: 0.1s; }
  /* While its app starts: the pressed tile stays lifted and a soft ring pulses around it */
  .cell.loading .lift { transform: scale(1.1) translateY(-8px); }
  .lift::after {
    content: ""; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
    border: 3px solid rgba(255,255,255,0.85); border-radius: 30px; /* tile radius + 10 */
    opacity: 0; pointer-events: none;
  }
  .cell.loading .lift::after { -webkit-animation: launch-pulse 1.2s ease-out infinite; animation: launch-pulse 1.2s ease-out infinite; }
  @-webkit-keyframes launch-pulse { from { opacity: 0.9; -webkit-transform: scale(1); } to { opacity: 0; -webkit-transform: scale(1.08); } }
  @keyframes launch-pulse { from { opacity: 0.9; transform: scale(1); } to { opacity: 0; transform: scale(1.08); } }
  .act.loading { -webkit-animation: launch-fade 1.2s ease-in-out infinite; animation: launch-fade 1.2s ease-in-out infinite; }
  @-webkit-keyframes launch-fade { 50% { opacity: 0.55; } }
  @keyframes launch-fade { 50% { opacity: 0.55; } }
  /* While an app starts or is on screen, every other animation freezes (the background zoom, the
     glint), so the TV's GPU and CPU go to that app */
  .paused .photo, .paused .tile::after, .paused .ring { -webkit-animation-play-state: paused; animation-play-state: paused; }

  .name {
    position: absolute; left: 0; right: 0; top: 100%; margin-top: 24px;
    text-align: center; white-space: nowrap;
    font-size: 24px; font-weight: 600; color: var(--fg);
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.14s ease, transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .cell.focused .name { opacity: 1; transform: translateY(0); transition-delay: 0.05s; }

  /* Hero: what the background is, overlaid like the tvOS Top Shelf. A small label (MOVIE,
     TV SERIES, TRENDING NOW, PHOTO), the title large, then year and credit. */
  /* Anchored at the bottom, 70px above the app row: a long title or description grows upward into the
     picture, never down into the tiles */
  .hero {
    position: absolute; left: var(--edge); bottom: 400px; max-width: 1300px;
    text-shadow: 0 2px 18px rgba(0,0,0,0.45);
    transition: opacity 0.8s ease;
  }
  /* On a title row, clear of the row's label (75px above its cards) */
  .zone-trend .hero, .zone-classic .hero, .zone-later .hero { bottom: 445px; }
  .hero-eyebrow {
    font-size: 22px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--fg-dim);
  }
  .hero-title {
    margin-top: 8px; max-width: 1150px;
    font-size: 80px; font-weight: 300; letter-spacing: -0.015em; line-height: 1.02;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .hero-sub { margin-top: 14px; font-size: 26px; font-weight: 400; color: var(--fg-dim); }
  .hero-desc {
    margin-top: 12px; max-width: 820px;
    font-size: 26px; font-weight: 400; line-height: 1.42; color: var(--fg-dim);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .hero-desc:empty { display: none; }
  .credit {
    position: absolute; right: var(--edge); bottom: 28px; z-index: 4;
    font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.35);
  }
  /* Soft shade behind the hero text only (not the whole left half), so it reads on bright
     backgrounds without greying out the image */
  .scrim-left {
    position: absolute; top: 200px; left: 0; width: 1300px; height: 600px; z-index: 3;
    background: radial-gradient(ellipse 90% 62% at 0% 52%, rgba(0,0,0,0.58), rgba(0,0,0,0.26) 55%, rgba(0,0,0,0) 100%);
  }

  /* Hero "+ Watch Later" button: only for movie/TV backgrounds; Up from the apps focuses it */
  .hero-btn {
    display: none; align-items: center;
    margin-top: 26px; padding: 14px 30px; border-radius: 999px;
    font-size: 24px; font-weight: 600; text-shadow: none;
    transition: transform 0.2s cubic-bezier(0.34, 1.45, 0.64, 1), background-color 0.15s ease, color 0.15s ease;
  }
  .hero.can-save .hero-btn { display: inline-flex; }
  .hero-btn.focused, .act.focused { background: #fff; color: #111; transform: scale(1.06); }
  /* title rows use the detail view's buttons instead */
  .zone-trend .hero.can-save .hero-btn, .zone-classic .hero.can-save .hero-btn,
  .zone-later .hero.can-save .hero-btn, .search-open .hero.can-save .hero-btn { display: none; }

  /* Detail view: OK on a title card hides the rows and shows its actions under the hero */
  .hero-actions { display: none; margin-top: 26px; }
  .detail .hero-actions { display: flex; }
  .act {
    display: inline-flex; align-items: center; margin-right: 20px;
    padding: 14px 30px; border-radius: 999px;
    font-size: 24px; font-weight: 600; text-shadow: none;
    transition: transform 0.2s cubic-bezier(0.34, 1.45, 0.64, 1), background-color 0.15s ease, color 0.15s ease;
  }
  .act.disabled { color: var(--fg-dim); }

  /* Rows stack vertically (apps, Trending, Classics, Watch Later) inside .rows: Trending 338px below
     the apps, each title row 380px below the one above (their cards are taller). Moving down
     slides .rows up so the active row always sits where the apps row does; rows above it fade
     away (leaving room for the hero) and the next row's label peeks in at the bottom, like tvOS. */
  .rows {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
    will-change: transform;
    pointer-events: none;
  }
  .detail .rows { opacity: 0; }
  .rows .cell { pointer-events: auto; }
  .shelf, .title-shelf { transition: opacity 0.3s ease; }
  .title-shelf { position: absolute; left: var(--edge); right: 0; }
  /* label (41px) + gap (34px) above the cards: shelves start 75px above the 750px card line */
  #trend-shelf { top: 1033px; }
  #classic-shelf { top: 1413px; }
  #later-shelf { top: 1793px; }
  .zone-trend .rows { transform: translateY(-358px); }
  .zone-classic .rows { transform: translateY(-738px); }
  .zone-later .rows { transform: translateY(-1118px); }
  .zone-trend .shelf,
  .zone-classic .shelf, .zone-classic #trend-shelf,
  .zone-later .shelf, .zone-later #trend-shelf, .zone-later #classic-shelf { opacity: 0; }
  .row-label {
    text-align: left; line-height: 41px;
    font-size: 34px; font-weight: 600; letter-spacing: -0.01em; color: var(--fg);
    text-shadow: 0 1px 10px rgba(0,0,0,0.5);
  }
  .title-row {
    display: flex; margin-top: 34px;
    transition: transform 0.24s cubic-bezier(0.25, 1, 0.5, 1);
    will-change: transform;
  }
  /* Title cards: the backdrop itself, with the title on a soft gradient. No glint here: it's for the
     glossy app icons, and skipping its oversized layer saves GPU memory across ~40 cards. */
  /* A dark base under each card's image, so a card is never see-through while its image loads */
  .title-row .tile { background-size: cover; background-color: #15171d; }
  .title-row .lift, .browse-grid .lift { background-color: #15171d; } /* same at the rounded corners */
  .title-row .more-card .lift { background-color: transparent; }
  /* Title cards are larger than the app tiles: 416x234 (16:9), so the artwork reads from the couch */
  .title-row .cell { width: 416px; }
  .title-row .tile { width: 416px; height: 234px; }
  .title-row .tile::after { display: none; }
  /* No glass rim or hairline on photos: on a backdrop they read as a see-through border */
  .title-row .tile::before { display: none; }
  .title-row .lift { box-shadow: 0 2px 3px rgba(0,0,0,0.28), 0 8px 20px -4px rgba(0,0,0,0.32); }
  .poster-title {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1;
    padding: 40px 18px 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
    font-size: 24px; font-weight: 600; line-height: 1.15;
  }
  /* Under the focused saved title: where it's streaming */
  .provider { font-weight: 500; color: var(--fg-dim); }
  .cell.empty .tile {
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 28px; font-size: 20px; line-height: 1.35; color: var(--fg-dim);
    background: rgba(20, 22, 28, 0.45);
  }

  /* Toast: short confirmations ("Added to Watch Later", launch errors) */
  .toast {
    position: absolute; left: 50%; top: 190px;
    transform: translate(-50%, -50%) scale(0.96);
    padding: 20px 36px; border-radius: 999px;
    font-size: 28px; font-weight: 600;
    opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* Recommendations off (or no TMDB key): no title rows or search; Controls moves to the right edge */
  .simple .title-shelf, .simple .search-btn { display: none; }
  .simple .controls-btn { right: var(--edge); }
  .simple .controls-label { right: calc(var(--edge) - 20px); }

  /* ---------- Themes ----------
     Glass (above) is the default. The others restyle it through a class on <html> (theme-midnight,
     theme-paper, theme-cinema, theme-nature) set from settings.json "theme": colours, materials and
     a few signature touches, never layout, so the remote moves the same way in every theme.
     Each theme restates the focused look too: its .glass rule would otherwise win over it. */
  @font-face { font-family: "Fraunces"; font-weight: 400; font-display: swap; src: url(fonts/fraunces-400.woff2) format("woff2"); }
  @font-face { font-family: "Playfair Display"; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/playfair-400-italic.woff2) format("woff2"); }

  /* Midnight: deep navy. The photo keeps its contrast at the centre and sinks into midnight at the
     edges (a grade, not a dim); violet glow on focus */
  .theme-midnight { --fg: #eceaff; --fg-dim: #b9b6e8; --fg-faint: rgba(236,234,255,0.5); }
  .theme-midnight #stage, .theme-midnight #bg-fallback { background: #07081a; }
  .theme-midnight .photo.visible { opacity: 0.86; }
  .theme-midnight .scrim-top { height: 240px; background: linear-gradient(to bottom, rgba(7,8,26,0.8), rgba(7,8,26,0)); }
  .theme-midnight .scrim-bottom { height: 520px; background: linear-gradient(to top, rgba(7,8,26,0.95), rgba(7,8,26,0.45) 55%, rgba(7,8,26,0)); }
  .theme-midnight .scrim-left {
    top: 0; height: 100%; width: 1500px;
    background: linear-gradient(to right, rgba(7,8,26,0.9) 0%, rgba(7,8,26,0.62) 36%, rgba(7,8,26,0) 78%);
  }
  .theme-midnight .seg-on { background: rgba(157,123,255,0.24); color: #fff; }
  .theme-midnight .glass {
    background: rgba(18,20,52,0.82); border: 1px solid rgba(150,140,255,0.28);
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }
  .theme-midnight .profile.focused, .theme-midnight .search-btn.focused, .theme-midnight .controls-btn.focused,
  .theme-midnight .hero-btn.focused, .theme-midnight .act.focused, .theme-midnight .voice-type.focused,
  .theme-midnight .profile-item.focused, .theme-midnight .controls-item.focused, .theme-midnight .key.focused,
  .theme-midnight .more-card.focused .more-circle, .theme-midnight .idle .voice-mic.focused,
  .theme-midnight .error .voice-mic.focused {
    background: linear-gradient(90deg, #b85cff, #5a7bff); color: #fff;
  }
  .theme-midnight .controls-item.focused .sub { color: rgba(255,255,255,0.8); }
  .theme-midnight .cell.focused .lift::before {
    box-shadow: 0 0 0 3px #9d7bff, 0 0 40px rgba(140,100,255,0.6), 0 30px 60px -12px rgba(0,0,0,0.6);
  }
  .theme-midnight .lift::after { border-color: #9d7bff; }
  .theme-midnight .hero-eyebrow, .theme-midnight .controls-head { color: #a99cff; }
  .theme-midnight .tile.app-tile, .theme-midnight .title-row .tile, .theme-midnight .title-row .lift,
  .theme-midnight .browse-grid .tile, .theme-midnight .browse-grid .lift { background-color: #14162e; }
  .theme-midnight .search-ui, .theme-midnight .browse-ui { background: rgba(7,8,26,0.84); }

  /* Paper: warm, softly dimmed paper (easy on the eyes in a dark room), ink-dark text and focus, the photo
     meeting the page at a crisp edge, a serif title */
  .theme-paper { --fg: #1d1b16; --fg-dim: #5e594f; --fg-faint: rgba(29,27,22,0.45); }
  .theme-paper #stage, .theme-paper #bg-fallback { background: #ece5d7; }
  .theme-paper .seg, .theme-paper .profile-name, .theme-paper .controls-label, .theme-paper .controls-head,
  .theme-paper .controls-item, .theme-paper .more-label, .theme-paper .name, .theme-paper .hero,
  .theme-paper .row-label { text-shadow: none; }
  .theme-paper .scrim-top { background: linear-gradient(to bottom, rgba(236,229,215,0.7), rgba(236,229,215,0)); }
  .theme-paper .scrim-bottom { background: linear-gradient(to top, #ece5d7 0%, rgba(236,229,215,0.9) 50%, rgba(236,229,215,0)); }
  .theme-paper .scrim-left {
    top: 0; height: 100%; width: 1500px;
    background: linear-gradient(to right, #ece5d7 0%, #ece5d7 50%, rgba(236,229,215,0.9) 54%, rgba(236,229,215,0) 64%);
  }
  .theme-paper .glass {
    background: #fff; border: 1px solid #e2dccd; box-shadow: 0 4px 14px rgba(60,48,30,0.10);
  }
  .theme-paper .profile.focused, .theme-paper .search-btn.focused, .theme-paper .controls-btn.focused,
  .theme-paper .hero-btn.focused, .theme-paper .act.focused, .theme-paper .voice-type.focused,
  .theme-paper .profile-item.focused, .theme-paper .controls-item.focused, .theme-paper .key.focused,
  .theme-paper .more-card.focused .more-circle, .theme-paper .idle .voice-mic.focused,
  .theme-paper .error .voice-mic.focused {
    background: #1d1b16; color: #ece5d7;
  }
  .theme-paper .controls-item .sub { color: #5e594f; }
  .theme-paper .controls-item.focused .sub { color: rgba(236,229,215,0.75); }
  .theme-paper .controls-rule { background: rgba(29,27,22,0.12); }
  .theme-paper .seg-wx path[fill="#fff"], .theme-paper .seg-wx path[fill="#E6E9EF"],
  .theme-paper .seg-wx path[fill="#C9CED8"] { fill: #cfc8b8; }
  .theme-paper .seg-wx path[fill="#E8E6F5"] { fill: #e2c98f; } /* the moon */
  .theme-paper .seg-wx g[fill="#fff"] { fill: #9fb7d6; }       /* snow */
  .theme-paper .seg-wx g[stroke="#C7CCD6"] { stroke: #b5ad9c; } /* fog */
  .theme-paper .controls-head { color: #8a5a2b; }
  .theme-paper .controls-label {
    padding: 2px 0; border-radius: 999px; background: rgba(236,229,215,0.9); /* readable over any photo */
  }
  .theme-paper .hero-eyebrow { color: #8a5a2b; }
  .theme-paper .hero-title { font-family: "Fraunces", Georgia, serif; font-weight: 400; letter-spacing: -0.01em; max-width: 860px; }
  .theme-paper .lift, .theme-paper .title-row .lift { box-shadow: 0 0 0 1px #d8cfbd, 0 4px 14px rgba(60,48,30,0.12); }
  .theme-paper .cell.focused .lift::before { box-shadow: 0 0 0 3px #1d1b16, 0 18px 34px rgba(60,48,30,0.22); }
  .theme-paper .lift::after { border-color: #1d1b16; }
  .theme-paper .tile.app-tile { background-color: #fff; }
  .theme-paper .poster-title { color: #fff; }
  .theme-paper .credit { color: rgba(29,27,22,0.4); }
  .theme-paper .cell.empty .tile { background: rgba(255,255,255,0.75); }
  .theme-paper .search-ui, .theme-paper .browse-ui { background: rgba(236,229,215,0.95); }
  .theme-paper .key, .theme-paper .voice-mic { background: rgba(29,27,22,0.07); color: #1d1b16; }
  .theme-paper .listening .voice-mic { background: linear-gradient(145deg, #8e8cf6 0%, #5e5ce6 45%, #bf5af2 100%); color: #fff; }
  .theme-paper .more-card .more-label { color: #1d1b16; }
  .theme-paper .seg-on { background: rgba(29,27,22,0.08); color: #1d1b16; }

  /* Cinema: black, a letterbox bar across the top, gold accents, an italic serif title */
  .theme-cinema { --fg: #f4efe4; --fg-dim: #c9c1b2; --fg-faint: rgba(244,239,228,0.45); }
  /* square-ish movie cards only: app icons come pre-shaped with 20px corners */
  .theme-cinema .title-row, .theme-cinema .browse-grid { --tile-r: 6px; }
  .theme-cinema #stage, .theme-cinema #bg-fallback { background: #000; }
  .theme-cinema #stage::after, .theme-cinema #stage::before {
    content: ""; position: absolute; left: 0; right: 0; z-index: 3; background: #000;
  }
  .theme-cinema #stage::after { top: 0; height: 114px; }
  .theme-cinema #stage::before { bottom: 0; height: 72px; } /* the matching lower bar, under the rows */
  .theme-cinema .scrim-bottom { background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.2) 55%, rgba(0,0,0,0)); }
  .theme-cinema .scrim-left {
    top: 114px; height: 760px; width: 1400px;
    background: linear-gradient(to right, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.2) 55%, rgba(0,0,0,0) 100%);
  }
  .theme-cinema .glass {
    background: rgba(12,12,12,0.82); border: 1px solid #3a352c; box-shadow: 0 10px 26px rgba(0,0,0,0.5);
  }
  .theme-cinema .profile.focused, .theme-cinema .search-btn.focused, .theme-cinema .controls-btn.focused,
  .theme-cinema .hero-btn.focused, .theme-cinema .act.focused, .theme-cinema .voice-type.focused,
  .theme-cinema .profile-item.focused, .theme-cinema .controls-item.focused, .theme-cinema .key.focused,
  .theme-cinema .more-card.focused .more-circle, .theme-cinema .idle .voice-mic.focused,
  .theme-cinema .error .voice-mic.focused {
    background: #d9b46a; color: #000;
  }
  .theme-cinema .controls-item.focused .sub { color: rgba(0,0,0,0.65); }
  .theme-cinema .cell.focused .lift::before {
    box-shadow: 0 0 0 3px #d9b46a, 0 0 30px rgba(217,180,106,0.45), 0 22px 40px rgba(0,0,0,0.65);
  }
  .theme-cinema .seg-on { background: rgba(217,180,106,0.12); color: #d9b46a; }
  .theme-cinema .poster-title { font-size: 19px; letter-spacing: 0.12em; text-transform: uppercase; }
  .theme-cinema .lift::after { border-color: #d9b46a; }
  .theme-cinema .title-row .lift::after { border-radius: 16px; } /* card radius + 10 */
  .theme-cinema .hero-eyebrow, .theme-cinema .controls-head { color: #d9b46a; letter-spacing: 0.22em; }
  .theme-cinema .hero-title { font-family: "Playfair Display", Georgia, serif; font-style: italic; font-weight: 400; font-size: 92px; }
  .theme-cinema .row-label { font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: #c9c1b2; }
  .theme-cinema .tile.app-tile { background-color: #0d0d0d; }
  .theme-cinema .search-ui, .theme-cinema .browse-ui { background: rgba(0,0,0,0.86); }

  /* Every theme: "View more" stays a bare circle and label (the themes' card rules would box it in) */
  #stage .more-card .lift, #stage .more-card .lift::before { box-shadow: none; background-color: transparent; }
  #stage .title-row .more-card .tile { background: none; }

  /* Nature: the photo first. Warm, earthy glass with a sage tint, a soft sage focus, lighter type, a
     larger thin clock, rounder tiles */
  .theme-nature { --tile-r: 24px; }
  .theme-nature .scrim-top { height: 220px; background: linear-gradient(to bottom, rgba(18,22,14,0.42), rgba(18,22,14,0)); }
  .theme-nature .scrim-bottom { background: linear-gradient(to top, rgba(18,22,14,0.42), rgba(18,22,14,0.1) 50%, rgba(18,22,14,0)); }
  .theme-nature .scrim-left { background: radial-gradient(ellipse 90% 62% at 0% 52%, rgba(18,22,14,0.45), rgba(18,22,14,0.18) 55%, rgba(18,22,14,0) 100%); }
  .theme-nature .glass {
    background:
      linear-gradient(180deg, rgba(255,252,240,0.2) 0%, rgba(255,252,240,0.08) 60%, rgba(255,252,240,0.12) 100%),
      rgba(52,62,44,0.32);
    border: 1px solid rgba(240,245,225,0.34);
    box-shadow: inset 0 1.5px 0 rgba(255,255,245,0.5), 0 10px 28px rgba(10,14,8,0.22);
  }
  .theme-nature .profile.focused, .theme-nature .search-btn.focused, .theme-nature .controls-btn.focused,
  .theme-nature .hero-btn.focused, .theme-nature .act.focused, .theme-nature .voice-type.focused,
  .theme-nature .profile-item.focused, .theme-nature .controls-item.focused, .theme-nature .key.focused,
  .theme-nature .more-card.focused .more-circle, .theme-nature .idle .voice-mic.focused,
  .theme-nature .error .voice-mic.focused {
    background: #eef3e4; color: #1f2a1c;
  }
  .theme-nature .controls-item.focused .sub { color: #4d5a45; }
  .theme-nature .cell.focused .lift::before {
    box-shadow: 0 0 0 3px #d6e6c8, 0 0 34px rgba(176,214,150,0.5), 0 30px 60px -12px rgba(10,14,8,0.5);
  }
  .theme-nature .lift::after { border-color: #d6e6c8; border-radius: 34px; } /* tile radius + 10 */
  .theme-nature .seg-on { background: rgba(240,245,225,0.18); font-size: 30px; font-weight: 300; }
  .theme-nature .seg, .theme-nature .profile-name { font-weight: 400; }
  .theme-nature .hero-eyebrow { color: #d6e6c8; }
  .theme-nature .hero-title { font-weight: 300; font-size: 92px; letter-spacing: -0.03em; }
  .theme-nature .row-label { font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg-fallback"></div>
  <div class="photo" id="photo-a"></div>
  <div class="photo" id="photo-b"></div>
  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>
  <div class="scrim-left"></div>

  <div class="statusbar glass">
    <div class="seg seg-on" id="clock">--:--</div>
    <div class="seg" id="date"></div>
    <div class="seg seg-wx" id="weather">
      <span id="wx-icon"></span><span id="wx-temp"></span><span class="hilo" id="wx-hilo"></span>
    </div>
  </div>

  <div class="profile glass" id="profile">
    <div class="avatar" id="profile-avatar"></div>
    <div class="profile-name" id="profile-name"></div>
  </div>
  <div class="profile-menu glass" id="profile-menu"></div>
  <div class="controls-btn glass" id="controls-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>
    </svg>
  </div>
  <div class="controls-label" id="controls-label">Controls</div>
  <div class="controls-menu glass" id="controls-menu"></div>
  <div class="search-btn glass" id="search-btn">
    <svg viewBox="0 0 32 32" fill="none" stroke-width="3.2" stroke-linecap="round">
      <circle cx="13.5" cy="13.5" r="9"/><path d="M20.5 20.5L28 28"/>
    </svg>
  </div>
  <div class="browse-ui" id="browse-ui">
    <div class="browse-title" id="browse-title"></div>
    <div class="browse-window"><div class="browse-grid" id="browse-grid"></div></div>
  </div>
  <div class="search-ui" id="search-ui">
    <div class="voice-panel" id="voice-panel">
      <div class="voice-mic" id="voice-mic">
        <div class="ring"></div><div class="ring r2"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
          <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
        </svg>
      </div>
      <div class="voice-headline" id="voice-headline"></div>
      <div class="voice-hint" id="voice-hint"></div>

<!-- config.js: settings.json plus the TMDB key, written by scripts/deploy.sh (and scripts/preview.sh) -->
<script src="config.js"></script>
<script src="catalog.js"></script>
<script src="titles.js"></script>
<script>
(function () {
  "use strict";

  var SETTINGS = window.ZEN_SETTINGS || {};
  var APP_NAME = SETTINGS.appName || "Zen TV"; // settings.json "appName": in the TV's app list and the Controls menu
  document.title = APP_NAME;
  // The look for the whole TV (settings.json "theme"); ?theme= overrides it, for previews
  var THEMES = ["glass", "midnight", "paper", "cinema", "nature"];
  var themeAsked = String((location.search.match(/[?&]theme=(\w+)/) || [])[1] || SETTINGS.theme || "").toLowerCase();
  var THEME = THEMES.indexOf(themeAsked) >= 0 ? themeAsked : "glass";
  if (THEME !== "glass") document.documentElement.className += " theme-" + THEME;
  // Recommendations (settings.json "recommendations", on by default; needs a TMDB key): movie and
  // TV backgrounds, the Trending / Classics / Watch Later rows and search. Off, or with no key, the
  // home screen keeps it simple: the apps over landscape photos. ?recommendations=off previews it.
  var recsAsked = (location.search.match(/[?&]recommendations=(\w+)/) || [])[1];
  var recsSetting = String(SETTINGS.recommendations).toLowerCase(); // true / false, or "on" / "off"
  var RECOMMENDATIONS = !!SETTINGS.tmdbKey &&
    (recsAsked ? recsAsked !== "off" : recsSetting !== "false" && recsSetting !== "off");
  if (!RECOMMENDATIONS) document.documentElement.className += " simple";
  var CATALOG = window.ZEN_CATALOG;
  var WEATHER = SETTINGS.weather && SETTINGS.weather.latitude != null ? SETTINGS.weather : null; // none: no weather shown

  // An app from settings: a catalog key ("netflix") or a custom { key, name, store, ids, providers }
  function appFrom(a) {
    if (typeof a !== "string") return a;
    var c = CATALOG.apps[a];
    return c ? { key: a, name: c.name, store: c.store, ids: c.ids, providers: c.providers } : null;
  }
  // The app row, in its starting order (it then reorders by each profile's use). Icons come from the
  // TV (scripts/zentv.py icons), shaped to the tile; an app without one shows its name.
  var APPS = (SETTINGS.apps || []).map(appFrom).filter(Boolean);
  if (!APPS.length) APPS = ["netflix", "youtube", "prime"].map(appFrom); // none known: a starting row
  var LAUNCH_SERVICE = "http://127.0.0.1:8001/api/v2/applications/";
  var CLOCK_24H = SETTINGS.clock24h !== false;

  // Wikimedia Commons featured pictures, bundled in bg/ (1920px+). Chosen for soft, natural colour
  // (mean saturation under ~70). Credits shown on screen.
  var PHOTOS = [
    ["03.jpg", "Canterbury, New Zealand",      "Michal Klajban", "CC BY-SA 4.0"],
    ["05.jpg", "Atacama Desert, Chile",        "Diego Delso", "CC BY-SA 4.0"],
    ["06.jpg", "Tierra del Fuego, Argentina",  "Godot13", "CC BY-SA 4.0"],
    ["10.jpg", "Graubünden, Switzerland",      "Dominicus Johannes Bergsma", "CC BY-SA 4.0"],
    ["11.jpg", "Unspoilt Wilderness",          "David Marcu", "CC0"],
    ["15.jpg", "Holländaröd, Sweden",          "W.carter", "CC0"],
    ["16.jpg", "Tuscany, Italy",               "Pamela Doretti", "CC BY-SA 4.0"],
    ["17.jpg", "Männikjärve Bog, Estonia",     "Abrget47j", "CC BY-SA 3.0"],
    ["18.jpg", "Jasmund, Germany",             "Moahim", "CC BY-SA 4.0"],
    ["19.jpg", "Hinnøya, Norway",              "Ximonic (Simo Räsänen)", "CC BY-SA 3.0"],
    ["20.jpg", "Santa Catarina, Brazil",       "Ctseelig", "CC BY-SA 4.0"],
    ["21.jpg", "High Fens, Belgium",           "Trougnouf (Benoit Brummer)", "CC BY 4.0"],
    ["22.jpg", "Zhangjiajie, China",           "chensiyuan", "CC BY-SA 4.0"],
    ["23.jpg", "Kathleen Lake, Yukon",         "Jakub Fryš", "CC BY-SA 4.0"],
    ["24.jpg", "Sognefjellet, Norway",         "Ximonic (Simo Räsänen)", "CC BY-SA 3.0"]
  ];
  var PHOTO_SECONDS = SETTINGS.backgroundSeconds || 60;

  // Movie & TV backdrops from TMDB, mixed with the landscapes. Titles and lookups live in
  // titles.js; the key comes from config.js, which `scripts/zentv.py config` writes into the build from
  // the key file named in settings.json. Without a key, or with recommendations off, only landscapes are shown.
  // Attribution per TMDB's terms: this product uses the TMDB API but is not endorsed or certified by TMDB.
  var TMDB_KEY = RECOMMENDATIONS ? SETTINGS.tmdbKey : ""; // no key: nothing is fetched from TMDB
  var TMDB_IMG = "https://image.tmdb.org/t/p/original"; // full-resolution masters, often 4K
  var MIN_BG_WIDTH = 1920; // the TV draws at 1920x1080; anything smaller would look soft
  // Rotation pattern: about half favourites (picks + acclaimed), a quarter trending/new, a quarter landscapes
  // Nature puts the landscapes first: three in four backgrounds, with a movie now and then
  var MIX = !RECOMMENDATIONS ? ["landscape"]
    : THEME === "nature" ? ["landscape", "landscape", "favorite", "landscape"]
    : ["favorite", "landscape", "favorite", "trending"];
  var TMDB_REFRESH_HOURS = 6;

  var isTizen = typeof window.tizen !== "undefined";

  /* ---------- Profiles ---------- */
  // Who's watching (profiles from settings.json), remembered on the TV so power-on opens to the last
  // one. Each keeps their own Watch Later, app order, Trending/Classics taste and backgrounds.
  var PROFILE_KEY = "zen.profile";
  var PROFILES = window.ZEN_TITLES.profiles;
  var profile = PROFILES[Object.keys(PROFILES)[0]];
  try { profile = PROFILES[localStorage.getItem(PROFILE_KEY)] || profile; } catch (e) {}
  function profileKey(base) { return window.ZEN_TITLES.profileKey(base, profile); }
  // Switching reloads the launcher as the other person: everything rebuilds from their data
  function switchProfile(id) {
    if (id === profile.id) return;
    try { localStorage.setItem(PROFILE_KEY, id); } catch (e) {}
    location.reload();
  }
  var $ = function (id) { return document.getElementById(id); };
  /* ---------- Stage scaling (browser preview only; the TV is 1920x1080) ---------- */
  function fitStage() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    $("stage").style.transform = "scale(" + s + ")";
  }
  if (!isTizen) {
    window.addEventListener("resize", fitStage);
    fitStage();
  }

  /* ---------- Clock ---------- */
  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  var lastClock = "";
  function tick() {
    if (document.hidden) return; // nothing to draw while another app is on screen
    var d = new Date();
    // only touch the DOM when the minute changes (each write repaints the glass bar)
    var h = d.getHours();
    var clock = (CLOCK_24H ? ("0" + h).slice(-2) : (h % 12 || 12)) + ":" + ("0" + d.getMinutes()).slice(-2);
    if (clock === lastClock) return;
    lastClock = clock;
    $("clock").textContent = clock;
    $("date").textContent = DAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- Weather (Open-Meteo, no key) ---------- */
  var WX_ICONS = {
    sun: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="12" fill="#FFD25A"/><g stroke="#FFD25A" stroke-width="4" stroke-linecap="round"><path d="M32 6v7M32 51v7M6 32h7M51 32h7M13.6 13.6l5 5M45.4 45.4l5 5M13.6 50.4l5-5M45.4 18.6l5-5"/></g></svg>',
    moon: '<svg viewBox="0 0 64 64"><path d="M42 44a18 18 0 0 1-16-31 20 20 0 1 0 25 25 18 18 0 0 1-9 6z" fill="#E8E6F5"/></svg>',
    partly: '<svg viewBox="0 0 64 64"><circle cx="24" cy="24" r="10" fill="#FFD25A"/><path d="M22 50h26a10 10 0 0 0 0-20 14 14 0 0 0-27 4 8 8 0 0 0 1 16z" fill="#fff"/></svg>',
    cloud: '<svg viewBox="0 0 64 64"><path d="M18 48h30a11 11 0 0 0 0-22 15 15 0 0 0-29 4 9 9 0 0 0-1 18z" fill="#E6E9EF"/></svg>',
    fog: '<svg viewBox="0 0 64 64"><path d="M18 38h30a11 11 0 0 0 0-22 15 15 0 0 0-29 4 9 9 0 0 0-1 18z" fill="#E6E9EF"/><g stroke="#C7CCD6" stroke-width="4" stroke-linecap="round"><path d="M12 46h40M18 54h28"/></g></svg>',
    rain: '<svg viewBox="0 0 64 64"><path d="M18 38h30a11 11 0 0 0 0-22 15 15 0 0 0-29 4 9 9 0 0 0-1 18z" fill="#E6E9EF"/><g stroke="#6FB6FF" stroke-width="4" stroke-linecap="round"><path d="M22 46l-3 8M33 46l-3 8M44 46l-3 8"/></g></svg>',
    storm: '<svg viewBox="0 0 64 64"><path d="M18 38h30a11 11 0 0 0 0-22 15 15 0 0 0-29 4 9 9 0 0 0-1 18z" fill="#C9CED8"/><path d="M34 40l-8 12h7l-3 9 10-13h-7l3-8z" fill="#FFD25A"/></svg>',
    snow: '<svg viewBox="0 0 64 64"><path d="M18 38h30a11 11 0 0 0 0-22 15 15 0 0 0-29 4 9 9 0 0 0-1 18z" fill="#E6E9EF"/><g fill="#fff"><circle cx="22" cy="50" r="3"/><circle cx="33" cy="54" r="3"/><circle cx="44" cy="50" r="3"/></g></svg>'
  };

  function describe(code, isDay) {
    if (code === 0) return [isDay ? "sun" : "moon", "Clear"];
    if (code <= 2) return [isDay ? "partly" : "moon", "Partly Cloudy"];
    if (code === 3) return ["cloud", "Cloudy"];
    if (code === 45 || code === 48) return ["fog", "Fog"];
    if (code >= 51 && code <= 57) return ["rain", "Drizzle"];
    if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return ["rain", "Rain"];
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ["snow", "Snow"];
    if (code >= 95) return ["storm", "Thunderstorms"];
    return ["cloud", ""];
  }

  function loadWeather() {
    if (!WEATHER) return; // no location in settings.json
    if (document.hidden) return; // refreshed again on the next interval
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + WEATHER.latitude + "&longitude=" + WEATHER.longitude +
      "&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min" +
      "&temperature_unit=" + (WEATHER.units === "celsius" ? "celsius" : "fahrenheit") + "&timezone=auto&forecast_days=1";
    var x = new XMLHttpRequest();
    x.open("GET", url);
    x.timeout = 15000; // a fetch couldn't be cancelled; this frees the connection if it hangs
    x.onload = function () {
      var d;
      try { d = JSON.parse(x.responseText); } catch (e) { return; } // keep hidden on a bad answer
      if (!d || !d.current || !d.daily) return;
      var c = d.current;
      var desc = describe(c.weather_code, c.is_day === 1);
      $("wx-icon").innerHTML = WX_ICONS[desc[0]];
      $("wx-temp").textContent = Math.round(c.temperature_2m) + "° " + desc[1];
      $("wx-hilo").textContent = "H:" + Math.round(d.daily.temperature_2m_max[0]) + "° L:" + Math.round(d.daily.temperature_2m_min[0]) + "°";
      $("weather").className = "seg seg-wx ready";
    };
    x.send(); // offline or no answer: stays hidden until the next try
  }
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);

  /* ---------- Rotating photo background ---------- */
  // Two layers crossfade: the incoming photo is preloaded, then faded in over the old one.
  var layers = [$("photo-a"), $("photo-b")];
  var front = 0;

  function shuffled(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Each background is { id, src, eyebrow, title, sub } (sub = year or photo credit). Every pool keeps
  // its own shuffled queue, and MIX decides which pool the next background comes from (empty pools
  // fall back to landscapes).
  var pools = {
    landscape: PHOTOS.map(function (p) {
      return { id: "photo:" + p[0], src: "bg/" + p[0], eyebrow: "Photo", title: p[1], sub: p[2] + " · " + p[3] };
    }),
    favorite: [],
    trending: []
  };
  var queues = { landscape: [], favorite: [], trending: [] };
  var mixStep = 0;
  var lastShown = null;

  // Remember what was shown in the last week (per TV, in localStorage) so titles don't repeat
  // while fresh ones are available
  var SHOWN_KEY = "zen.shown.v1";
  var REPEAT_AFTER_MS = 7 * 86400000;
  var MIN_FRESH = 5; // below this many unseen, allow repeats rather than cycle a tiny set
  function readShown() {
    var shown;
    try { shown = JSON.parse(localStorage.getItem(SHOWN_KEY)) || {}; } catch (e) { shown = {}; }
    var cutoff = Date.now() - REPEAT_AFTER_MS;
    Object.keys(shown).forEach(function (id) { if (shown[id] < cutoff) delete shown[id]; });
    return shown;
  }
  function markShown(bg) {
    var shown = readShown();
    shown[bg.id] = Date.now();
    try { localStorage.setItem(SHOWN_KEY, JSON.stringify(shown)); } catch (e) {}
  }

  function take(kind) {
    var queue = queues[kind];
    if (!queue.length) {
      var shown = readShown();
      var unseen = pools[kind].filter(function (bg) { return !shown[bg.id]; });
      Array.prototype.push.apply(queue, shuffled(unseen.length >= MIN_FRESH ? unseen : pools[kind]));
      // Don't repeat the same background across a reshuffle
      if (queue[0] === lastShown && queue.length > 1) queue.push(queue.shift());
    }
    return queue.shift();
  }
  function nextBackground() {
    var kind = MIX[mixStep++ % MIX.length];
    if (!pools[kind].length) kind = "landscape";
    lastShown = take(kind);
    if (kind !== "landscape") markShown(lastShown); // landscapes are few; let them cycle freely
    return lastShown;
  }

  // Trim a description to about two lines, at a word boundary
  var DESC_MAX = 150;
  function shorten(text, max) {
    if (text.length <= max) return text;
    var cut = text.slice(0, max);
    return cut.slice(0, cut.lastIndexOf(" ")).replace(/[,;:.\s]+$/, "") + "…";
  }

  // The background lists are kept on the TV per profile for TMDB_REFRESH_HOURS, so a restart or a
  // profile switch shows movie backgrounds straight away instead of refetching ~20 lists. A fetch
  // that comes back empty or partial (e.g. no network yet) retries after a minute.
  var BG_CACHE_KEY = profileKey("zen.bgpools.v1");
  var TMDB_REFRESH_MS = TMDB_REFRESH_HOURS * 3600 * 1000, TMDB_RETRY_MS = 60000;
  var tmdbLoadedAt = 0, tmdbLoading = false, tmdbRetry = null;
  // Fill the favourite / trending pools from load()'s lists; false if there was nothing
  function applyBgLists(r) {
    // The eyebrow says why it's here: a pick (just Movie / TV Series), "Because you like …",
    // "Classic · Movie", or "Trending & new · TV Series"
    function toBg(it) {
      var kind = kindOf(it);
      return itemToBg(it, it.reason.indexOf("Because") === 0 ? it.reason : it.reason ? it.reason + " · " + kind : kind);
    }
    // About half the rotation: your picks plus what they lead to (recommendations, classics)
    var favorites = r.picks.concat(r.recs, r.classics).map(toBg);
    var trending = r.fresh.map(toBg);
    if (favorites.length) { pools.favorite = favorites; queues.favorite.length = 0; }
    if (trending.length) { pools.trending = trending; queues.trending.length = 0; }
    return favorites.length + trending.length > 0;
  }
  function loadTmdb() {
    clearTimeout(tmdbRetry);
    if (document.hidden) return; // don't compete with the app being watched; retried on return
    if (!TMDB_KEY || !window.ZEN_TITLES || tmdbLoading) return;
    if (Date.now() - tmdbLoadedAt < TMDB_REFRESH_MS) return;
    tmdbLoading = true;
    window.ZEN_TITLES.load(TMDB_KEY, profile, readLater(), function (r) {
      tmdbLoading = false;
      var any = applyBgLists(r);
      // Picks come from a week-long cache even offline; without classics and trending & new the
      // lists are partial: show what there is and fetch again in a minute
      if (!any || !r.classics.length || !r.fresh.length) { tmdbRetry = setTimeout(loadTmdb, TMDB_RETRY_MS); return; }
      tmdbLoadedAt = Date.now();
      try { localStorage.setItem(BG_CACHE_KEY, JSON.stringify({ savedAt: tmdbLoadedAt, lists: r })); } catch (e) {}
    });
  }
  // The saved lists first (instant), then a fetch only once they're stale
  try {
    var bgCache = JSON.parse(localStorage.getItem(BG_CACHE_KEY));
    // shown either way; only complete lists count as fresh (older builds saved some without trending & new)
    if (bgCache && applyBgLists(bgCache.lists) && bgCache.lists.classics.length && bgCache.lists.fresh.length) {
      tmdbLoadedAt = bgCache.savedAt;
    }
  } catch (e) {}
  setTimeout(loadTmdb, 3000); // after startup settles, so first paint and key presses come first
  setInterval(loadTmdb, 30 * 60 * 1000); // checks; it only fetches once the lists are stale
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") loadTmdb();
  });

  var currentBg = null;       // the background on screen now (the hero describes it)
  var holdBackground = false; // true while browsing the hero button or a title row: no auto-rotation
  var displayToken = 0;       // only the latest requested background gets shown (bumped to cancel)
  var screenBgId = null;      // the background faded in last (the hero catches up a moment later)
  var hideTimers = [null, null]; // pending fade-out per photo layer
  var heroTimer = null;

  // Crossfade to a background and describe it in the hero.
  //   opts.fast       a focus preview: quicker fades
  //   opts.minWidth   reject smaller images (calls opts.onTooSmall instead)
  //   opts.onError    the image failed to load
  function displayBg(photo, opts) {
    opts = opts || {};
    var token = ++displayToken;
    var img = new Image();
    img.onload = function () {
      if (token !== displayToken) return; // a newer request superseded this one
      if (opts.minWidth && img.naturalWidth < opts.minWidth) { if (opts.onTooSmall) opts.onTooSmall(); return; }
      screenBgId = photo.id;
      var inIdx = 1 - front, outIdx = front;
      var incoming = layers[inIdx];
      var outgoing = layers[outIdx];
      // A layer may still have a hide pending from an earlier swap (fast scrolling reuses layers
      // quickly); cancel it, or it would hide the image we're about to show and leave a blank screen
      clearTimeout(hideTimers[inIdx]);
      // That layer may still be partly visible (fast scrolling): hide it instantly, with no fade,
      // so the new image always fades in from nothing instead of cutting in at full brightness
      incoming.style.transition = "none";
      // Focus previews stay still: each new card would otherwise restart the slow zoom at a
      // different size, so the picture jumps while scrolling
      incoming.className = opts.fast ? "photo fast" : "photo kb" + Math.floor(Math.random() * 4);
      incoming.style.backgroundImage = 'url("' + photo.src + '")';
      void incoming.offsetWidth; // apply the hidden state (and restart the zoom) before fading in
      incoming.style.transition = "";
      incoming.style.zIndex = 2;
      outgoing.style.zIndex = 1;
      incoming.className += " visible";
      // Once the new photo fully covers it, hide the old one and release its image, so only one
      // full-screen (often 4K) bitmap stays in the TV's memory
      clearTimeout(hideTimers[outIdx]);
      hideTimers[outIdx] = setTimeout(function () {
        outgoing.className = outgoing.className.replace(" visible", "");
        outgoing.style.backgroundImage = "";
      }, opts.fast ? 700 : 2600);
      front = 1 - front;
      $("bg-fallback").style.display = "none"; // a photo is up; stop blending the fallback gradient

      // Swap the hero text while it's faded out (textContent, since titles can contain & or <).
      // A single timer that every swap replaces, so an earlier, slower swap can't overwrite the
      // hero (or what "+ Watch Later" saves) with a title that's no longer on screen.
      var hero = $("hero");
      hero.style.opacity = 0;
      clearTimeout(heroTimer);
      heroTimer = setTimeout(function () { setHero(photo); }, opts.fast ? 250 : 900);
    };
    img.onerror = function () {
      if (token === displayToken && opts.onError) setTimeout(opts.onError, 1000);
    };
    img.src = photo.src;
  }

  // Describe a background in the hero (and make it what "+ Watch Later" saves)
  function setHero(photo) {
    $("hero-eyebrow").textContent = photo.eyebrow;
    $("hero-title").textContent = photo.title;
    $("hero-sub").textContent = photo.sub;
    $("hero-desc").textContent = photo.desc || "";
    $("credit").textContent = photo.credit || "";
    currentBg = photo;
    updateHeroButton();
    $("hero").style.opacity = "";
  }

  function showNext() {
    // no rotation while browsing a row, or while another app is on screen (the launcher can keep
    // running in the background; image loads would compete with the app you're watching)
    if (holdBackground || document.hidden) return;
    var photo = nextBackground();
    displayBg(photo, {
      minWidth: MIN_BG_WIDTH,
      // too small: never use it again (until the next refresh)
      onTooSmall: function () {
        Object.keys(pools).forEach(function (k) {
          pools[k] = pools[k].filter(function (bg) { return bg.id !== photo.id; });
        });
        showNext();
      },
      // network hiccup: just move on, it may load next time
      onError: showNext
    });
  }
  showNext();
  setInterval(showNext, PHOTO_SECONDS * 1000);

  // Browsing a title row: show the focused title as the background, as a 1280px image (fast to
  // fetch and decode on the TV). No later swap to full resolution: decoding a 4K image right after
  // the fade made the TV flicker.
  var PREVIEW_DELAY_MS = 250;
  var previewTimer, pendingPreview = null;
  function previewBg(photo) {
    clearTimeout(previewTimer);
    pendingPreview = null;
    // Already on screen (back on the card just left): drop the other card's image if it's still loading
    if (screenBgId === photo.id) { displayToken++; return; }
    pendingPreview = function () {
      pendingPreview = null;
      displayBg({
        id: photo.id, src: photo.src.replace("/original/", "/w1280/"), eyebrow: photo.eyebrow,

  // another app.

  // accepts but the app never comes on screen, we ask once more, then fall back to launching by

  // few seconds to appear (YouTube TV ~2.5s), hence the patient retry rather than a quick fallback.
  function openApp(app) {

  /* ---------- Title rows: Watch Later and Trending ---------- */
  var THUMB = "https://image.tmdb.org/t/p/w500";

  var TITLE_VISIBLE = 4;     // cards fully on screen

  // Streaming apps on this TV and their TMDB provider IDs (| = any of). Tiles reuse their

  var EXTRA_APPS = {};

  // Every app with movies/shows to look up, and its TMDB provider IDs (| = any of)

      id: it.id, src: TMDB_IMG + it.path, eyebrow: eyebrow, title: it.title,
      sub: it.sub || [it.year].concat(it.genres || []).filter(Boolean).join(" · "),
      desc: it.desc || shorten(it.overview || "", DESC_MAX),
      credit: "Images: TMDB",
      type: it.type, tmdbId: it.tmdbId, path: it.path, year: it.year,

  // A horizontally scrolling row of title cards. makeCell(item) builds a card; onFocus(item)
  // runs when focus lands on one. Card images load only once they're on screen or next to it, and
  // only for a row that's on screen or just below it (row.near, set by setZone): ~60 cards across
  // the rows would otherwise all download and decode at startup.

    row.setNear = function (near) {

        row.cells = [el.firstChild];

  function titleCard(it, under) {

    var lift = document.createElement("div");
    lift.className = "lift";
    var tile = document.createElement("div");

    var name = document.createElement("div");

  /* ---------- Watch Later ---------- */
  // Saved on the TV in localStorage, newest first: [{ id, type, tmdbId, title, year, path, sub, desc,

  // Where a title is streaming in the US: { text, app (a key, or null if not on an app here), checkedAt }
